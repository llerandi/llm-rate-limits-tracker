[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-rate-limits-tracker"
version = "1.0.0"
description = "Weekly-updated LLM API rate limits from all major providers. Zero-dependency wrapper around the llm-rate-limits-tracker JSON API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "llerandi" }]
keywords = ["llm", "rate-limits", "rpm", "tpm", "ai", "anthropic", "openai", "groq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://llerandi.github.io/llm-rate-limits-tracker/"
Repository = "https://github.com/llerandi/llm-rate-limits-tracker"
"Bug Tracker" = "https://github.com/llerandi/llm-rate-limits-tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_rate_limits_tracker"]
