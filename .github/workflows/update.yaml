name: Weekly Rate Limit Update

on:
  schedule:
    # Runs at 07:00 UTC every Monday
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Snapshot, detect changes, and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate rate-limits.json
        run: python scripts/validate.py

      - name: Write weekly snapshot
        run: python scripts/snapshot.py

      - name: Generate per-provider files
        run: python scripts/generate_providers.py

      - name: Generate badge files
        run: python scripts/generate_badges.py

      - name: Generate Atom feed
        run: python scripts/generate_feed.py

      - name: Generate changelog
        run: python scripts/generate_changelog.py

      - name: Detect rate limit changes
        id: detect
        env:
          SUMMARY_FILE: /tmp/rate_limit_changes.md
        run: python scripts/detect_changes.py >> $GITHUB_OUTPUT

      - name: Open issue for rate limit changes
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Rate limit changes detected on $(date +%Y-%m-%d)" \
            --body-file /tmp/rate_limit_changes.md

      - name: Update README badge date
        run: |
          BADGE_DATE=$(date +%Y--%m--%d)
          sed -i "s/last--updated-[0-9]\{4\}--[0-9]\{2\}--[0-9]\{2\}/last--updated-${BADGE_DATE}/" README.md

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rate-limits.json data/history/ data/providers/ data/badges/ data/feed.xml data/changelog.md README.md
          git diff --staged --quiet || git commit -m "chore: weekly snapshot and provider files [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge jsDelivr CDN cache
        run: python scripts/purge_cdn.py
